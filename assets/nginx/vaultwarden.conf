# Vaultwarden for TOS 7 — nginx 兜底跳转（WebUI External Open / 直开端口模式）
# 安装位置: /usr/local/vaultwarden/nginx/vaultwarden.conf（平台规范要求随包携带）
#
# 为什么是 302 而不是反代（docs/DESIGN_DECISIONS.md D-001/D-007）：
#   Vaultwarden 的 API 固定挂载在 URL 根（/api /identity /notifications /icons
#   /alive …），web vault 前端也存在根相对请求，不支持子路径；而 TOS 8181 的
#   根命名空间属于平台自身，不能占用。因此应用本体直开 :8222，此 location 仅
#   做兜底：用户手输 http://<IP>:8181/vaultwarden/ 时优雅跳转到应用真实入口。
location /vaultwarden/ {
    absolute_redirect off;
    return 302 http://$host:8222/;
}
location = /vaultwarden {
    absolute_redirect off;
    return 302 http://$host:8222/;
}
