# Vaultwarden for TOS 7 — nginx 网关反代（保留前缀模式，docs/DESIGN_DECISIONS.md D-010）
# 安装位置: /usr/local/vaultwarden/nginx/vaultwarden.conf，postinst 镜像到
# /etc/nginx/conf.d/vaultwarden.conf（平台在 server 上下文 include conf.d，
# 此处只写裸 location，Beszel/hermes 已验证模式）。
#
# 服务本体只监听 127.0.0.1:8222（回环封闭），本路由是唯一入口：
#   /vaultwarden/<anything> → 127.0.0.1:8222/vaultwarden/<anything>
# 前缀保留转发：vaultwarden 经 DOMAIN 的路径部分原生把全部路由
# （/api /identity /notifications /icons /admin …）挂载在 /vaultwarden 之下，
# 因此无需剥前缀、无重写边角（上游官方支持的部署方式）。
location /vaultwarden/ {
    proxy_pass http://127.0.0.1:8222/vaultwarden/;
    absolute_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级（实时同步推送 /notifications/hub）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # 长连接与附件上传/下载
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 525m;
}
# 无尾斜杠入口（坑 13：不匹配上面的前缀 location，须精确匹配发相对 302）
location = /vaultwarden {
    absolute_redirect off;
    return 302 /vaultwarden/;
}
# 隐私政策（坑 45/C3：三处可达之 nginx 精确路由；alias 精确匹配优先于前缀反代）
location = /vaultwarden/privacy-policy.html {
    alias /usr/local/vaultwarden/privacy/privacy-policy.html;
    default_type text/html;
}
