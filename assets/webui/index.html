<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaultwarden Password Manager</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #101418; color: #d8dee6;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .card { text-align: center; }
  .shield {
    width: 96px; height: 96px; margin: 0 auto 20px;
    filter: drop-shadow(0 6px 24px rgba(46, 104, 240, .45));
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  a { color: #4da3ff; }
  code { background:#1d2430; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
  <div class="card">
    <svg class="shield" viewBox="0 0 24 24" fill="#175DDC" aria-hidden="true">
      <path d="M12 1 3 4.5v6.09c0 5.05 3.41 9.76 9 11.41 5.59-1.65 9-6.36 9-11.41V4.5L12 1zm-1.5 15L7 12.5l1.41-1.41L10.5 13.17l4.59-4.59L16.5 10l-6 6z"/>
    </svg>
    <p>正在打开 Vaultwarden（版本 @@VERSION@@）…</p>
    <p>若未自动跳转，请访问 <a id="link" href="#">本机 :@@APP_PORT@@ 入口</a></p>
  </div>
  <script>
    // 按当前访问主机的地址拼出直开端口入口（直开端口模式，D-001）
    var url = 'http://' + location.hostname + ':@@APP_PORT@@/';
    document.getElementById('link').href = url;
    location.replace(url);
  </script>
</body>
</html>
